name: test and build
on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened

jobs:
  build-deploy:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: start
        run: echo "🎉 The job was automatically triggered by ${{ github.actor }}"

      - name: checkout code
        uses: actions/checkout@v5

      - name: setup jdk 21
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 21

      - name: unit tests
        run: mvn -B test --file pom.xml

      - name: build the app
        run: |
          mvn clean
          mvn -B package --file pom.xml
